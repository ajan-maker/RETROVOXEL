<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RETROegg</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  outline: none;
}

#help {
  position: fixed;
  top: 15px;
  left: 15px;
  padding: 12px 15px;
  color: white;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.6;
  pointer-events: none;
  user-select: none;
}

#controls {
  position: fixed;
  left: 18px;
  bottom: 18px;
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 58px);
  gap: 7px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.move-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 58px;
  height: 58px;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 15px;
  background: rgba(35, 39, 43, 0.78);
  color: white;
  font-size: 27px;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.3);
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

.move-button:active,
.move-button.pressed {
  background: rgba(100, 110, 120, 0.95);
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.3);
}

#up {
  grid-column: 2;
  grid-row: 1;
}

#left {
  grid-column: 1;
  grid-row: 2;
}

#down {
  grid-column: 2;
  grid-row: 2;
}

#right {
  grid-column: 3;
  grid-row: 2;
}

@media (max-width: 600px) {
  #help {
    top: 10px;
    left: 10px;
    padding: 9px 11px;
    font-size: 12px;
  }

  #controls {
    left: 12px;
    bottom: 14px;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(2, 50px);
    gap: 6px;
  }

  .move-button {
    width: 50px;
    height: 50px;
    font-size: 25px;
    border-radius: 13px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="help">
  <b>RETROegg</b><br>
  WASD / Arrow Keys: Move<br>
  Drag screen: Rotate camera
</div>

<div id="controls">
  <button class="move-button" id="up" aria-label="Move forward">⬆️</button>
  <button class="move-button" id="left" aria-label="Move left">⬅️</button>
  <button class="move-button" id="down" aria-label="Move backward">⬇️</button>
  <button class="move-button" id="right" aria-label="Move right">➡️</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

// ==============================
// SCENE
// ==============================

const canvas = document.getElementById("game");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

// ==============================
// LIGHTING
// ==============================

scene.add(new THREE.HemisphereLight(0xffffff, 0x63784a, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(20, 40, 15);
scene.add(sunlight);

// ==============================
// GRASS TEXTURE
// ==============================

function createGrassTexture() {
  const grassCanvas = document.createElement("canvas");
  grassCanvas.width = 256;
  grassCanvas.height = 256;

  const ctx = grassCanvas.getContext("2d");

  ctx.fillStyle = "#55a832";
  ctx.fillRect(0, 0, 256, 256);

  for (let i = 0; i < 2200; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    const size = Math.random() * 2 + 1;

    const colors = [
      "#4d9b2c",
      "#63b83a",
      "#438e29",
      "#72bd43",
      "#58a934"
    ];

    ctx.fillStyle = colors[
      Math.floor(Math.random() * colors.length)
    ];

    ctx.fillRect(x, y, size, size);
  }

  const texture = new THREE.CanvasTexture(grassCanvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(12, 8);
  texture.colorSpace = THREE.SRGBColorSpace;

  return texture;
}

// ==============================
// GROUND
// ==============================

const groundGeometry = new THREE.PlaneGeometry(160, 100);

const groundMaterial = new THREE.MeshStandardMaterial({
  map: createGrassTexture()
});

const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
scene.add(ground);

// ==============================
// FLOATING STONE CUBE
// ==============================

const stoneGeometry = new THREE.BoxGeometry(2, 2, 2);

const stoneMaterial = new THREE.MeshStandardMaterial({
  color: 0x888888,
  roughness: 1,
  metalness: 0
});

const stone = new THREE.Mesh(stoneGeometry, stoneMaterial);
stone.position.set(0, 3.2, 0);
scene.add(stone);

// The stone stays still and does not rotate.

// ==============================
// PLAYER MOVEMENT POSITION
// ==============================

// Invisible position used for movement and camera following.
const player = new THREE.Object3D();
player.position.set(0, 0, 9);
scene.add(player);

// ==============================
// CAMERA
// ==============================

let cameraYaw = 0;

const cameraDistance = 10;
const cameraHeight = 5;

const cameraTarget = new THREE.Vector3();
const cameraPosition = new THREE.Vector3();

function updateCamera() {
  // Horizontal rotation only. The camera never tilts up or down.
  cameraPosition.set(
    player.position.x + Math.sin(cameraYaw) * cameraDistance,
    player.position.y + cameraHeight,
    player.position.z + Math.cos(cameraYaw) * cameraDistance
  );

  camera.position.copy(cameraPosition);

  cameraTarget.set(
    player.position.x,
    player.position.y + 2,
    player.position.z
  );

  camera.lookAt(cameraTarget);
}

updateCamera();

// ==============================
// CAMERA DRAG
// ==============================

let draggingCamera = false;
let lastPointerX = 0;

const cameraSensitivity = 0.006;

canvas.addEventListener("pointerdown", (event) => {
  draggingCamera = true;
  lastPointerX = event.clientX;

  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", (event) => {
  if (!draggingCamera) return;

  const deltaX = event.clientX - lastPointerX;
  lastPointerX = event.clientX;

  // Only horizontal movement changes the camera.
  // Vertical finger or mouse movement is ignored.
  cameraYaw -= deltaX * cameraSensitivity;

  updateCamera();
});

function stopCameraDrag() {
  draggingCamera = false;
}

canvas.addEventListener("pointerup", stopCameraDrag);
canvas.addEventListener("pointercancel", stopCameraDrag);
canvas.addEventListener("lostpointercapture", stopCameraDrag);

// ==============================
// KEYBOARD CONTROLS
// ==============================

const keys = {};

window.addEventListener("keydown", (event) => {
  const key = event.key.toLowerCase();

  if (
    ["w", "a", "s", "d", "arrowup", "arrowdown",
     "arrowleft", "arrowright"].includes(key)
  ) {
    event.preventDefault();
    keys[key] = true;
  }
});

window.addEventListener("keyup", (event) => {
  keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
  for (const key in keys) {
    keys[key] = false;
  }

  releaseAllButtons();
});

// ==============================
// MOBILE EMOJI BUTTONS
// ==============================

const buttonKeys = {
  up: "arrowup",
  down: "arrowdown",
  left: "arrowleft",
  right: "arrowright"
};

const movementButtons = document.querySelectorAll(".move-button");

function releaseButton(button) {
  const key = buttonKeys[button.id];
  if (key) keys[key] = false;

  button.classList.remove("pressed");
}

function releaseAllButtons() {
  movementButtons.forEach(releaseButton);
}

movementButtons.forEach((button) => {
  button.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    event.stopPropagation();

    const key = buttonKeys[button.id];
    if (key) keys[key] = true;

    button.classList.add("pressed");

    try {
      button.setPointerCapture(event.pointerId);
    } catch {}
  });

  button.addEventListener("pointerup", (event) => {
    event.preventDefault();
    releaseButton(button);
  });

  button.addEventListener("pointercancel", () => {
    releaseButton(button);
  });

  button.addEventListener("lostpointercapture", () => {
    releaseButton(button);
  });

  button.addEventListener("contextmenu", (event) => {
    event.preventDefault();
  });
});

// Avoid stuck movement keys if the pointer leaves the page.
window.addEventListener("pointerup", () => {
  movementButtons.forEach((button) => {
    if (button.classList.contains("pressed")) {
      releaseButton(button);
    }
  });
});

// ==============================
// MOVEMENT
// ==============================

const clock = new THREE.Clock();

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const movement = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const speed = 10 * delta;

  // Movement direction follows the camera's horizontal angle.
  forward.set(
    -Math.sin(cameraYaw),
    0,
    -Math.cos(cameraYaw)
  );

  right.set(
    Math.cos(cameraYaw),
    0,
    -Math.sin(cameraYaw)
  );

  movement.set(0, 0, 0);

  if (keys["w"] || keys["arrowup"]) {
    movement.add(forward);
  }

  if (keys["s"] || keys["arrowdown"]) {
    movement.sub(forward);
  }

  if (keys["d"] || keys["arrowright"]) {
    movement.add(right);
  }

  if (keys["a"] || keys["arrowleft"]) {
    movement.sub(right);
  }

  // Diagonal movement is not faster than straight movement.
  if (movement.lengthSq() > 0) {
    movement.normalize();
    player.position.addScaledVector(movement, speed);
  }

  // Keep movement inside the grass area.
  player.position.x = THREE.MathUtils.clamp(
    player.position.x, -78, 78
  );

  player.position.z = THREE.MathUtils.clamp(
    player.position.z, -48, 48
  );

  updateCamera();
  renderer.render(scene, camera);
}

animate();

// ==============================
// RESIZE
// ==============================

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  updateCamera();
});
</script>

</body>
</html>
