
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RETROegg</title>

<style>
* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
    touch-action: none;
}

body { position: relative; }
canvas { display: block; }

#logo {
    position: fixed;
    top: 18px;
    left: 22px;
    color: white;
    font-size: 25px;
    font-weight: 900;
    text-shadow: 2px 3px 4px #333;
    z-index: 2;
    pointer-events: none;
}

#mobile-controls {
    position: fixed;
    left: 18px;
    bottom: 18px;
    display: grid;
    grid-template-columns: 54px 54px 54px;
    grid-template-rows: 54px 54px;
    gap: 5px;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

.arrow-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(35, 40, 35, 0.82);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.75);
    border-radius: 12px;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    outline: none;
}

.arrow-btn:active,
.arrow-btn.pressed {
    background: #27ae60;
    transform: scale(0.94);
}

#up-btn { grid-column: 2; grid-row: 1; }
#left-btn { grid-column: 1; grid-row: 2; }
#down-btn { grid-column: 2; grid-row: 2; }
#right-btn { grid-column: 3; grid-row: 2; }

#controls {
    position: fixed;
    left: 20px;
    bottom: 150px;
    padding: 12px 16px;
    color: white;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    z-index: 2;
    pointer-events: none;
}

@media (max-width: 600px) {
    #mobile-controls {
        left: 12px;
        bottom: 12px;
        grid-template-columns: 48px 48px 48px;
        grid-template-rows: 48px 48px;
        gap: 4px;
    }

    .arrow-btn {
        font-size: 25px;
        border-radius: 10px;
    }

    #controls {
        left: 12px;
        bottom: 118px;
        font-size: 11px;
        padding: 7px 10px;
    }

    #logo {
        top: 12px;
        left: 12px;
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div id="logo">RETROegg</div>

<div id="mobile-controls">
    <button class="arrow-btn" id="up-btn">⬆️</button>
    <button class="arrow-btn" id="left-btn">⬅️</button>
    <button class="arrow-btn" id="down-btn">⬇️</button>
    <button class="arrow-btn" id="right-btn">➡️</button>
</div>

<div id="controls">
    <b>CONTROLS</b><br>
    W / ⬆️ — Forward<br>
    A / ⬅️ — Left<br>
    S / ⬇️ — Backward<br>
    D / ➡️ — Right<br>
    Drag screen — Rotate camera
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from "three";

// SCENE

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 150);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.domElement.style.position = "fixed";
renderer.domElement.style.left = "0";
renderer.domElement.style.top = "0";
renderer.domElement.style.zIndex = "0";

document.body.appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffffff, 0x526b38, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2.5);
sunlight.position.set(25, 40, 20);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(2048, 2048);
sunlight.shadow.camera.left = -45;
sunlight.shadow.camera.right = 45;
sunlight.shadow.camera.top = 45;
sunlight.shadow.camera.bottom = -45;
scene.add(sunlight);

// GRASS TEXTURE

const textureCanvas = document.createElement("canvas");
textureCanvas.width = 256;
textureCanvas.height = 256;

const ctx = textureCanvas.getContext("2d");
ctx.fillStyle = "#4caa43";
ctx.fillRect(0, 0, 256, 256);

for (let i = 0; i < 3500; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;

    const colors = [
        "#58b84b",
        "#439b38",
        "#64bd52",
        "#3d9135",
        "#76c85c"
    ];

    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    ctx.fillRect(x, y, 2, 3);
}

const grassTexture = new THREE.CanvasTexture(textureCanvas);
grassTexture.wrapS = THREE.RepeatWrapping;
grassTexture.wrapT = THREE.RepeatWrapping;
grassTexture.repeat.set(24, 16);
grassTexture.colorSpace = THREE.SRGBColorSpace;

// WORLD

const ground = new THREE.Mesh(
    new THREE.BoxGeometry(160, 1, 100),
    new THREE.MeshStandardMaterial({
        map: grassTexture,
        roughness: 1
    })
);

ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// SPAWN BASE — 4x4 DIRT

const dirt = new THREE.Mesh(
    new THREE.BoxGeometry(4, 0.45, 4),
    new THREE.MeshStandardMaterial({
        color: 0x79502b,
        roughness: 1,
        flatShading: true
    })
);

dirt.position.set(0, 0.225, 0);
dirt.castShadow = true;
dirt.receiveShadow = true;
scene.add(dirt);

// PLAYER

const player = new THREE.Group();

const stone = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.8, 1.8),
    new THREE.MeshStandardMaterial({
        color: 0x888b91,
        roughness: 1,
        flatShading: true
    })
);

stone.castShadow = true;
stone.receiveShadow = true;
player.add(stone);

player.position.set(0, 3.2, 0);
scene.add(player);

// EGG DIRT

const eggDirt = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.45, 2.2),
    new THREE.MeshStandardMaterial({
        color: 0x9b7045,
        roughness: 1,
        flatShading: true
    })
);

eggDirt.position.set(72, 0.225, 42);
eggDirt.castShadow = true;
eggDirt.receiveShadow = true;
scene.add(eggDirt);

// EGG

const egg = new THREE.Group();

const eggMaterial = new THREE.MeshStandardMaterial({
    color: 0xfff4d6,
    roughness: 0.35,
    metalness: 0.02
});

const eggShell = new THREE.Mesh(
    new THREE.SphereGeometry(0.85, 32, 24),
    eggMaterial
);

eggShell.scale.set(0.72, 1, 0.72);
eggShell.castShadow = true;
eggShell.receiveShadow = true;
egg.add(eggShell);

egg.position.set(72, 3.2, 42);
scene.add(egg);

// TIMER LABEL ABOVE EGG

const timerCanvas = document.createElement("canvas");
timerCanvas.width = 512;
timerCanvas.height = 256;

const timerContext = timerCanvas.getContext("2d");

const timerTexture = new THREE.CanvasTexture(timerCanvas);
timerTexture.colorSpace = THREE.SRGBColorSpace;

const timerMaterial = new THREE.SpriteMaterial({
    map: timerTexture,
    transparent: true,
    depthTest: false
});

const timerLabel = new THREE.Sprite(timerMaterial);
timerLabel.scale.set(2.4, 1.2, 1);
timerLabel.visible = false;
timerLabel.renderOrder = 10;

scene.add(timerLabel);

function drawTimer(seconds) {
    timerContext.clearRect(0, 0, 512, 256);

    // Dark rounded background
    timerContext.fillStyle = "rgba(20, 20, 20, 0.85)";
    timerContext.beginPath();
    timerContext.roundRect(48, 42, 416, 172, 32);
    timerContext.fill();

    // White border
    timerContext.strokeStyle = "#ffffff";
    timerContext.lineWidth = 8;
    timerContext.stroke();

    // Countdown text
    const timeText = "00:" + String(seconds).padStart(2, "0");

    timerContext.fillStyle = "#ffffff";
    timerContext.font = "bold 100px Arial";
    timerContext.textAlign = "center";
    timerContext.textBaseline = "middle";
    timerContext.fillText(timeText, 256, 130);

    timerTexture.needsUpdate = true;
}

// EGG TOUCH + COUNTDOWN

const eggSpawnPosition = new THREE.Vector3(1.1, 3.2, 1.1);

let eggCollected = false;
let timerStarted = false;
let timerFinished = false;
let timerRemaining = 10;
let timerAccumulator = 0;

function checkEggTouch() {
    if (eggCollected) return;

    const distance = player.position.distanceTo(egg.position);

    if (distance < 2.2) {
        eggCollected = true;

        // Move egg onto the spawn base.
        egg.position.copy(eggSpawnPosition);

        // Start the countdown as soon as it arrives.
        timerStarted = true;
        timerRemaining = 10;
        timerAccumulator = 0;

        timerLabel.visible = true;
        drawTimer(timerRemaining);
    }
}

function updateEggTimer(delta) {
    if (!timerStarted || timerFinished) return;

    timerAccumulator += delta;

    while (timerAccumulator >= 1 && timerRemaining > 0) {
        timerAccumulator -= 1;
        timerRemaining--;

        drawTimer(timerRemaining);
    }

    // At 00:00, turn the egg grey.
    if (timerRemaining <= 0) {
        timerRemaining = 0;
        timerFinished = true;

        drawTimer(0);

        eggMaterial.color.set(0x808080);
        eggMaterial.roughness = 0.9;
        eggMaterial.metalness = 0;
    }
}

// MOVEMENT

const keys = {};

window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();

    if ([
        "w", "a", "s", "d",
        "arrowup", "arrowdown",
        "arrowleft", "arrowright"
    ].includes(key)) {
        event.preventDefault();
        keys[key] = true;
    }
});

window.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) keys[key] = false;

    document.querySelectorAll(".arrow-btn").forEach(button => {
        button.classList.remove("pressed");
    });
});

// MOBILE CONTROLS

const buttonKeys = {
    "up-btn": "w",
    "left-btn": "a",
    "down-btn": "s",
    "right-btn": "d"
};

for (const [id, key] of Object.entries(buttonKeys)) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();

        keys[key] = true;
        button.classList.add("pressed");

        try {
            button.setPointerCapture(event.pointerId);
        } catch {}
    });

    function releaseKey(event) {
        event.preventDefault();
        keys[key] = false;
        button.classList.remove("pressed");
    }

    button.addEventListener("pointerup", releaseKey);
    button.addEventListener("pointercancel", releaseKey);

    button.addEventListener("lostpointercapture", () => {
        keys[key] = false;
        button.classList.remove("pressed");
    });

    button.addEventListener("contextmenu", event => {
        event.preventDefault();
    });
}

// CAMERA

let cameraYaw = 0;
const cameraDistance = 11;
const cameraHeight = 5;

let cameraDragging = false;
let lastPointerX = 0;
const cameraSensitivity = 0.005;

const targetCameraPosition = new THREE.Vector3();
const cameraLookTarget = new THREE.Vector3();

function updateCamera(delta = 1) {
    targetCameraPosition.set(
        player.position.x + cameraDistance * Math.sin(cameraYaw),
        player.position.y + cameraHeight,
        player.position.z + cameraDistance * Math.cos(cameraYaw)
    );

    if (delta === 1) {
        camera.position.copy(targetCameraPosition);
    } else {
        camera.position.lerp(
            targetCameraPosition,
            1 - Math.exp(-12 * delta)
        );
    }

    cameraLookTarget.set(
        player.position.x,
        player.position.y,
        player.position.z
    );

    camera.lookAt(cameraLookTarget);
}

updateCamera();

// CAMERA DRAG

renderer.domElement.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;

    cameraDragging = true;
    lastPointerX = event.clientX;

    try {
        renderer.domElement.setPointerCapture(event.pointerId);
    } catch {}
});

renderer.domElement.addEventListener("pointermove", (event) => {
    if (!cameraDragging) return;

    const dx = event.clientX - lastPointerX;
    lastPointerX = event.clientX;
    cameraYaw -= dx * cameraSensitivity;
});

function stopCameraDrag() {
    cameraDragging = false;
}

renderer.domElement.addEventListener("pointerup", stopCameraDrag);
renderer.domElement.addEventListener("pointercancel", stopCameraDrag);
renderer.domElement.addEventListener("lostpointercapture", stopCameraDrag);

// GAME LOOP

const clock = new THREE.Clock();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const movement = new THREE.Vector3();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const speed = 10 * delta;

    // Keep the egg spinning.
    egg.rotation.y += 1.5 * delta;

    // Keep the timer label above the egg.
    timerLabel.position.set(
        egg.position.x,
        egg.position.y + 1.65,
        egg.position.z
    );

    // Move relative to camera direction.
    forward.set(
        -Math.sin(cameraYaw),
        0,
        -Math.cos(cameraYaw)
    );

    right.set(
        Math.cos(cameraYaw),
        0,
        -Math.sin(cameraYaw)
    );

    movement.set(0, 0, 0);

    if (keys["w"] || keys["arrowup"]) movement.add(forward);
    if (keys["s"] || keys["arrowdown"]) movement.sub(forward);
    if (keys["a"] || keys["arrowleft"]) movement.sub(right);
    if (keys["d"] || keys["arrowright"]) movement.add(right);

    if (movement.lengthSq() > 0) {
        movement.normalize();
        player.position.addScaledVector(movement, speed);
    }

    // World boundaries.
    player.position.x = THREE.MathUtils.clamp(
        player.position.x, -78, 78
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z, -48, 48
    );

    player.position.y = 3.2;

    // Check contact and update countdown.
    checkEggTouch();
    updateEggTimer(delta);

    updateCamera(delta);
    renderer.render(scene, camera);
}

animate();

// RESIZE

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>

</body>
</html>
