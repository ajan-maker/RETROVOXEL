
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RETROegg</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
    touch-action: none;
}

canvas {
    display: block;
    touch-action: none;
}

#logo {
    position: fixed;
    top: 18px;
    left: 22px;
    color: white;
    font-size: 25px;
    font-weight: 900;
    text-shadow: 2px 3px 4px #333;
    z-index: 2;
    pointer-events: none;
}

/* Controls panel */
#controls {
    position: fixed;
    left: 18px;
    bottom: 160px;
    padding: 12px 16px;
    color: white;
    background: rgba(0, 0, 0, 0.65);
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.8;
    z-index: 5;
    pointer-events: none;
}

/* Directional buttons */
#mobile-controls {
    position: fixed;
    left: 18px;
    bottom: 18px;
    display: grid;
    grid-template-columns: 54px 54px 54px;
    grid-template-rows: 54px 54px;
    gap: 5px;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

.arrow-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(35, 40, 35, 0.82);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.75);
    border-radius: 12px;
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
}

.arrow-btn:active {
    background: #27ae60;
    transform: scale(0.94);
}

#up-btn {
    grid-column: 2;
    grid-row: 1;
}

#left-btn {
    grid-column: 1;
    grid-row: 2;
}

#down-btn {
    grid-column: 2;
    grid-row: 2;
}

#right-btn {
    grid-column: 3;
    grid-row: 2;
}

@media (max-width: 600px) {
    #logo {
        top: 12px;
        left: 12px;
        font-size: 21px;
    }

    #controls {
        left: 12px;
        bottom: 145px;
        padding: 8px 11px;
        font-size: 11px;
        line-height: 1.65;
    }

    #mobile-controls {
        left: 12px;
        bottom: 12px;
        grid-template-columns: 48px 48px 48px;
        grid-template-rows: 48px 48px;
        gap: 4px;
    }

    .arrow-btn {
        font-size: 23px;
        border-radius: 10px;
    }
}
</style>
</head>

<body>

<div id="logo">RETROegg</div>

<div id="controls">
    <b>CONTROLS</b><br>
    W / ▲ — Forward<br>
    A / ◀ — Left<br>
    S / ▼ — Backward<br>
    D / ▶ — Right<br>
    <span>Drag to look around</span>
</div>

<div id="mobile-controls">
    <button class="arrow-btn" id="up-btn" aria-label="Move forward">▲</button>
    <button class="arrow-btn" id="left-btn" aria-label="Move left">◀</button>
    <button class="arrow-btn" id="down-btn" aria-label="Move backward">▼</button>
    <button class="arrow-btn" id="right-btn" aria-label="Move right">▶</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from "three";

// =========================
// SCENE
// =========================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 150);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// =========================
// LIGHTING
// =========================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x526b38,
        2
    )
);

const sunlight = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sunlight.position.set(25, 40, 20);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(2048, 2048);
sunlight.shadow.camera.left = -45;
sunlight.shadow.camera.right = 45;
sunlight.shadow.camera.top = 45;
sunlight.shadow.camera.bottom = -45;

scene.add(sunlight);

// =========================
// GRASS TEXTURE
// =========================

const textureCanvas = document.createElement("canvas");
textureCanvas.width = 256;
textureCanvas.height = 256;

const ctx = textureCanvas.getContext("2d");

ctx.fillStyle = "#4caa43";
ctx.fillRect(0, 0, 256, 256);

for (let i = 0; i < 3500; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;

    const colors = [
        "#58b84b",
        "#439b38",
        "#64bd52",
        "#3d9135",
        "#76c85c"
    ];

    ctx.fillStyle = colors[
        Math.floor(Math.random() * colors.length)
    ];

    ctx.fillRect(x, y, 2, 3);
}

const grassTexture = new THREE.CanvasTexture(textureCanvas);

grassTexture.wrapS = THREE.RepeatWrapping;
grassTexture.wrapT = THREE.RepeatWrapping;
grassTexture.repeat.set(24, 16);
grassTexture.colorSpace = THREE.SRGBColorSpace;

// =========================
// RECTANGULAR GRASS WORLD
// =========================

const ground = new THREE.Mesh(
    new THREE.BoxGeometry(160, 1, 100),
    new THREE.MeshStandardMaterial({
        map: grassTexture,
        roughness: 1
    })
);

ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// =========================
// STONE BLOCK CHARACTER
// =========================

const player = new THREE.Group();

const stone = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.8, 1.8),
    new THREE.MeshStandardMaterial({
        color: 0x888b91,
        roughness: 1,
        flatShading: true
    })
);

stone.castShadow = true;
stone.receiveShadow = true;

// No dots or extra details on the stone.
player.add(stone);

player.position.set(0, 3.2, 0);
scene.add(player);

// =========================
// MOVEMENT: WASD + ARROWS
// =========================

const keys = {};

window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();

    if ([
        "w", "a", "s", "d",
        "arrowup", "arrowdown",
        "arrowleft", "arrowright"
    ].includes(key)) {
        event.preventDefault();
    }

    keys[key] = true;
});

window.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) {
        keys[key] = false;
    }
});

// Mobile directional buttons

const buttonKeys = {
    "up-btn": "w",
    "left-btn": "a",
    "down-btn": "s",
    "right-btn": "d"
};

for (const [id, key] of Object.entries(buttonKeys)) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys[key] = true;
        button.setPointerCapture(event.pointerId);
    });

    function releaseKey(event) {
        event.preventDefault();
        keys[key] = false;
    }

    button.addEventListener("pointerup", releaseKey);
    button.addEventListener("pointercancel", releaseKey);

    button.addEventListener("lostpointercapture", () => {
        keys[key] = false;
    });

    button.addEventListener("contextmenu", (event) => {
        event.preventDefault();
    });
}

// =========================
// ROBLOX-STYLE CAMERA
// DESKTOP: MOUSE DRAG
// MOBILE: FINGER DRAG
// =========================

let cameraYaw = 0;
let cameraPitch = 0.18;

const cameraDistance = 10;
const cameraTargetHeight = 0.25;

let dragging = false;
let activePointerId = null;
let lastPointerX = 0;
let lastPointerY = 0;

// Don't start camera dragging on the movement buttons.
renderer.domElement.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) {
        return;
    }

    dragging = true;
    activePointerId = event.pointerId;

    lastPointerX = event.clientX;
    lastPointerY = event.clientY;

    if (event.pointerType === "mouse") {
        renderer.domElement.style.cursor = "grabbing";
    }
});

window.addEventListener("pointermove", (event) => {
    if (!dragging || event.pointerId !== activePointerId) {
        return;
    }

    const dx = event.clientX - lastPointerX;
    const dy = event.clientY - lastPointerY;

    lastPointerX = event.clientX;
    lastPointerY = event.clientY;

    cameraYaw -= dx * 0.005;
    cameraPitch -= dy * 0.004;

    // Prevent the camera from going under the ground
    // or flipping upside down.
    cameraPitch = THREE.MathUtils.clamp(
        cameraPitch,
        -0.15,
        0.85
    );
});

function stopDragging(event) {
    if (event.pointerId !== activePointerId) return;

    dragging = false;
    activePointerId = null;
    renderer.domElement.style.cursor = "default";
}

window.addEventListener("pointerup", stopDragging);
window.addEventListener("pointercancel", stopDragging);

// =========================
// CAMERA COLLISION
// =========================

const cameraPosition = new THREE.Vector3();
const cameraTarget = new THREE.Vector3();

function updateCamera(delta) {
    const horizontalDistance =
        cameraDistance * Math.cos(cameraPitch);

    cameraTarget.set(
        player.position.x,
        player.position.y + cameraTargetHeight,
        player.position.z
    );

    cameraPosition.set(
        player.position.x +
            horizontalDistance * Math.sin(cameraYaw),

        player.position.y +
            cameraDistance * Math.sin(cameraPitch) + 2.5,

        player.position.z +
            horizontalDistance * Math.cos(cameraYaw)
    );

    // Keep the camera outside the character.
    const offset = cameraPosition.clone().sub(cameraTarget);
    const minDistance = 4.0;

    if (offset.length() < minDistance) {
        offset.setLength(minDistance);
        cameraPosition.copy(cameraTarget).add(offset);
    }

    // Smooth camera movement.
    camera.position.lerp(
        cameraPosition,
        Math.min(1, 8 * delta)
    );

    camera.lookAt(cameraTarget);
}

// =========================
// GAME LOOP
// =========================

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const speed = 10 * delta;

    // Character movement

    if (keys["w"] || keys["arrowup"]) {
        player.position.z -= speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.position.z += speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
        player.position.x -= speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.position.x += speed;
    }

    // Stay inside the rectangular world.

    player.position.x = THREE.MathUtils.clamp(
        player.position.x, -78, 78
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z, -48, 48
    );

    // Keep the character at a fixed height.
    // It does not touch the grass or rotate.

    player.position.y = 3.2;

    updateCamera(delta);

    renderer.render(scene, camera);
}

animate();

// =========================
// RESIZE
// =========================

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
