
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RETROegg</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
    touch-action: none;
}

canvas {
    display: block;
}

#egg-message {
    position: fixed;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
    display: none;
    z-index: 20;
    pointer-events: none;
}

#mobile-controls {
    position: fixed;
    bottom: 22px;
    left: 20px;
    display: grid;
    grid-template-columns: 55px 55px 55px;
    grid-template-rows: 55px 55px;
    gap: 5px;
    z-index: 10;
    user-select: none;
}

.control {
    width: 55px;
    height: 55px;
    border: 2px solid rgba(255,255,255,0.65);
    border-radius: 12px;
    background: rgba(40,40,40,0.55);
    color: white;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    user-select: none;
}

#up {
    grid-column: 2;
    grid-row: 1;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}

#look-help {
    position: fixed;
    right: 12px;
    bottom: 15px;
    color: white;
    font-size: 12px;
    text-shadow: 1px 1px 3px black;
    pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="egg-message">...</div>

<div id="mobile-controls">
    <div class="control" id="up">▲</div>
    <div class="control" id="left">◀</div>
    <div class="control" id="down">▼</div>
    <div class="control" id="right">▶</div>
</div>

<div id="look-help">Drag to look around</div>

<script type="module">
import * as THREE from "three";

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 190);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHTING
========================= */

scene.add(new THREE.HemisphereLight(0xffffff, 0x63704a, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(30, 60, 20);
scene.add(sunlight);

/* =========================
   GROUND
========================= */

const groundGeometry = new THREE.BoxGeometry(160, 1, 100);
const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x48a83f
});

const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.position.set(0, -0.5, 0);
scene.add(ground);

/* =========================
   PLAYER
========================= */

const playerGeometry = new THREE.BoxGeometry(1.8, 1.8, 1.8);
const playerMaterial = new THREE.MeshStandardMaterial({
    color: 0x888888
});

const player = new THREE.Mesh(playerGeometry, playerMaterial);
player.position.set(0, 3.2, 0);
scene.add(player);

/* =========================
   SPAWN DIRT BLOCK
========================= */

const spawnBlockGeometry = new THREE.BoxGeometry(4, 0.45, 4);
const spawnBlockMaterial = new THREE.MeshStandardMaterial({
    color: 0x79502b
});

const spawnBlock = new THREE.Mesh(
    spawnBlockGeometry,
    spawnBlockMaterial
);

spawnBlock.position.set(0, 0.225, 0);
scene.add(spawnBlock);

/* =========================
   UPGRADE SIGN
   Moved a little in front of
   the spawn dirt block.
========================= */

const sign = new THREE.Group();
sign.position.set(0, 0, -4.5);
scene.add(sign);

/* Sign support posts */

const postMaterial = new THREE.MeshStandardMaterial({
    color: 0x79502b
});

const postGeometry = new THREE.BoxGeometry(0.22, 2.7, 0.22);

const leftPost = new THREE.Mesh(postGeometry, postMaterial);
leftPost.position.set(-1.15, 1.35, 0);
sign.add(leftPost);

const rightPost = new THREE.Mesh(postGeometry, postMaterial);
rightPost.position.set(1.15, 1.35, 0);
sign.add(rightPost);

/* Sign board */

const boardGeometry = new THREE.BoxGeometry(3.4, 2.15, 0.22);
const boardMaterial = new THREE.MeshStandardMaterial({
    color: 0x9b7045
});

const board = new THREE.Mesh(boardGeometry, boardMaterial);
board.position.set(0, 2.6, 0);
sign.add(board);

/* Sign text texture */

const signCanvas = document.createElement("canvas");
signCanvas.width = 512;
signCanvas.height = 320;

const signContext = signCanvas.getContext("2d");

signContext.clearRect(0, 0, 512, 320);
signContext.textAlign = "center";
signContext.textBaseline = "middle";

signContext.font = "bold 76px Arial";
signContext.fillStyle = "#ffffff";
signContext.fillText("UPGRADE", 256, 95);

signContext.font = "bold 88px Arial";
signContext.fillStyle = "#00ff38";
signContext.fillText("05.00", 256, 220);

const signTexture = new THREE.CanvasTexture(signCanvas);

const signTextMaterial = new THREE.MeshBasicMaterial({
    map: signTexture,
    transparent: true,
    side: THREE.DoubleSide
});

const signText = new THREE.Mesh(
    new THREE.PlaneGeometry(3.25, 2.03),
    signTextMaterial
);

signText.position.set(0, 2.6, 0.116);
sign.add(signText);

/* =========================
   EGG DIRT BLOCK
========================= */

const eggDirtGeometry = new THREE.BoxGeometry(2.2, 0.45, 2.2);
const eggDirtMaterial = new THREE.MeshStandardMaterial({
    color: 0x9b7045
});

const eggDirt = new THREE.Mesh(
    eggDirtGeometry,
    eggDirtMaterial
);

eggDirt.position.set(72, 0.225, 42);
scene.add(eggDirt);

/* =========================
   EGG
========================= */

const egg = new THREE.Mesh(
    new THREE.SphereGeometry(0.85, 32, 32),
    new THREE.MeshStandardMaterial({
        color: 0xfff4d6,
        roughness: 0.35
    })
);

egg.scale.set(0.72, 1, 0.72);
egg.position.set(72, 3.2, 42);
scene.add(egg);

let eggCollected = false;
let eggTimerStarted = false;
let eggTimer = 10;
let lastTimerSecond = 0;
let timerSprite = null;

/* =========================
   EGG TIMER
========================= */

function createTimerSprite() {
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 100;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(8, 8, 240, 84);

    ctx.font = "bold 58px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("00:10", 128, 52);

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true
    });

    const sprite = new THREE.Sprite(material);
    sprite.scale.set(3.1, 1.2, 1);
    return sprite;
}

function updateTimerSprite(value) {
    if (!timerSprite) return;

    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 100;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(8, 8, 240, 84);

    ctx.font = "bold 58px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("00:" + String(value).padStart(2, "0"), 128, 52);

    const newTexture = new THREE.CanvasTexture(canvas);
    timerSprite.material.map.dispose();
    timerSprite.material.map = newTexture;
    timerSprite.material.needsUpdate = true;
}

/* =========================
   MOVEMENT
========================= */

const keys = {
    forward: false,
    backward: false,
    left: false,
    right: false
};

window.addEventListener("keydown", (event) => {
    switch (event.key.toLowerCase()) {
        case "w":
        case "arrowup":
            keys.forward = true;
            break;
        case "s":
        case "arrowdown":
            keys.backward = true;
            break;
        case "a":
        case "arrowleft":
            keys.left = true;
            break;
        case "d":
        case "arrowright":
            keys.right = true;
            break;
    }
});

window.addEventListener("keyup", (event) => {
    switch (event.key.toLowerCase()) {
        case "w":
        case "arrowup":
            keys.forward = false;
            break;
        case "s":
        case "arrowdown":
            keys.backward = false;
            break;
        case "a":
        case "arrowleft":
            keys.left = false;
            break;
        case "d":
        case "arrowright":
            keys.right = false;
            break;
    }
});

/* Mobile controls */

function setupMobileButton(id, keyName) {
    const button = document.getElementById(id);

    const start = (event) => {
        event.preventDefault();
        keys[keyName] = true;
    };

    const stop = (event) => {
        event.preventDefault();
        keys[keyName] = false;
    };

    button.addEventListener("pointerdown", start);
    button.addEventListener("pointerup", stop);
    button.addEventListener("pointercancel", stop);
    button.addEventListener("pointerleave", stop);
}

setupMobileButton("up", "forward");
setupMobileButton("down", "backward");
setupMobileButton("left", "left");
setupMobileButton("right", "right");

/* =========================
   CAMERA LOOK
========================= */

let cameraYaw = 0;
let cameraPitch = 0.22;

let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;

renderer.domElement.addEventListener("pointerdown", (event) => {
    dragging = true;
    lastPointerX = event.clientX;
    lastPointerY = event.clientY;
});

window.addEventListener("pointerup", () => {
    dragging = false;
});

window.addEventListener("pointermove", (event) => {
    if (!dragging) return;

    const deltaX = event.clientX - lastPointerX;
    const deltaY = event.clientY - lastPointerY;

    cameraYaw -= deltaX * 0.005;
    cameraPitch -= deltaY * 0.003;

    cameraPitch = THREE.MathUtils.clamp(
        cameraPitch,
        -0.35,
        0.8
    );

    lastPointerX = event.clientX;
    lastPointerY = event.clientY;
});

/* =========================
   MAIN LOOP
========================= */

const clock = new THREE.Clock();
const eggMessage = document.getElementById("egg-message");

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    /* Player movement */

    const moveSpeed = 8 * delta;

    const forwardX = -Math.sin(cameraYaw);
    const forwardZ = -Math.cos(cameraYaw);

    const rightX = Math.cos(cameraYaw);
    const rightZ = -Math.sin(cameraYaw);

    if (keys.forward) {
        player.position.x += forwardX * moveSpeed;
        player.position.z += forwardZ * moveSpeed;
    }

    if (keys.backward) {
        player.position.x -= forwardX * moveSpeed;
        player.position.z -= forwardZ * moveSpeed;
    }

    if (keys.left) {
        player.position.x -= rightX * moveSpeed;
        player.position.z -= rightZ * moveSpeed;
    }

    if (keys.right) {
        player.position.x += rightX * moveSpeed;
        player.position.z += rightZ * moveSpeed;
    }

    player.position.x = THREE.MathUtils.clamp(
        player.position.x, -78, 78
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z, -48, 48
    );

    /* Camera follows player */

    const cameraDistance = 8;

    camera.position.x =
        player.position.x + Math.sin(cameraYaw) * cameraDistance;

    camera.position.z =
        player.position.z + Math.cos(cameraYaw) * cameraDistance;

    camera.position.y =
        player.position.y + 3 + cameraPitch * 5;

    camera.lookAt(
        player.position.x,
        player.position.y + 0.5,
        player.position.z
    );

    /* Egg rotation */

    if (!eggCollected) {
        egg.rotation.y += 1.5 * delta;
    }

    /* Collect egg by touching it */

    if (!eggCollected) {
        const distanceToEgg = player.position.distanceTo(egg.position);

        if (distanceToEgg < 2.2) {
            eggCollected = true;

            egg.position.set(1.1, 3.2, 1.1);
            egg.rotation.set(0, 0, 0);

            timerSprite = createTimerSprite();
            timerSprite.position.set(1.1, 5.0, 1.1);
            scene.add(timerSprite);

            eggTimerStarted = true;
            eggTimer = 10;
            lastTimerSecond = 0;
            updateTimerSprite(eggTimer);
        }
    }

    /* Egg timer countdown */

    if (eggTimerStarted && eggTimer > 0) {
        lastTimerSecond += delta;

        if (lastTimerSecond >= 1) {
            lastTimerSecond -= 1;
            eggTimer--;

            updateTimerSprite(eggTimer);

            if (eggTimer <= 0) {
                egg.material.color.set(0x808080);
                egg.material.needsUpdate = true;
            }
        }
    }

    /* Show ... near the sign */

    const signDistance = Math.hypot(
        player.position.x - sign.position.x,
        player.position.z - sign.position.z
    );

    eggMessage.style.display =
        signDistance < 3.5 ? "block" : "none";

    renderer.render(scene, camera);
}

animate();

/* =========================
   WINDOW RESIZE
========================= */

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
