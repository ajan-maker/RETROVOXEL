
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RETROegg</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
    touch-action: none;
}

canvas {
    display: block;
}

#logo {
    position: fixed;
    top: 18px;
    left: 22px;
    color: white;
    font-size: 25px;
    font-weight: 900;
    text-shadow: 2px 3px 4px #333;
    z-index: 2;
    pointer-events: none;
}

#controls {
    position: fixed;
    left: 20px;
    bottom: 20px;
    padding: 12px 16px;
    color: white;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.7;
    z-index: 2;
    pointer-events: none;
}

/* Mobile and desktop directional buttons */

#mobile-controls {
    position: fixed;
    left: 18px;
    bottom: 18px;
    display: grid;
    grid-template-columns: 54px 54px 54px;
    grid-template-rows: 54px 54px;
    gap: 5px;
    z-index: 10;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

.arrow-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(35, 40, 35, 0.82);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.75);
    border-radius: 12px;
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
}

.arrow-btn:active {
    background: #27ae60;
    transform: scale(0.94);
}

#up-btn {
    grid-column: 2;
    grid-row: 1;
}

#left-btn {
    grid-column: 1;
    grid-row: 2;
}

#down-btn {
    grid-column: 2;
    grid-row: 2;
}

#right-btn {
    grid-column: 3;
    grid-row: 2;
}

@media (max-width: 600px) {
    #mobile-controls {
        left: 12px;
        bottom: 12px;
        grid-template-columns: 48px 48px 48px;
        grid-template-rows: 48px 48px;
        gap: 4px;
    }

    .arrow-btn {
        font-size: 23px;
        border-radius: 10px;
    }

    #controls {
        left: 12px;
        bottom: 124px;
        font-size: 11px;
        padding: 7px 10px;
    }

    #logo {
        top: 12px;
        left: 12px;
        font-size: 21px;
    }
}

#status {
    position: fixed;
    top: 20px;
    right: 20px;
    color: white;
    background: rgba(0, 0, 0, 0.45);
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13px;
    z-index: 2;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="logo">RETROegg</div>

<div id="status">FLY MODE: ON</div>

<div id="mobile-controls">
    <button class="arrow-btn" id="up-btn" aria-label="Move forward">▲</button>
    <button class="arrow-btn" id="left-btn" aria-label="Move left">◀</button>
    <button class="arrow-btn" id="down-btn" aria-label="Move backward">▼</button>
    <button class="arrow-btn" id="right-btn" aria-label="Move right">▶</button>
</div>

<div id="controls">
    <b>CONTROLS</b><br>
    W / ▲ — Forward<br>
    A / ◀ — Left<br>
    S / ▼ — Backward<br>
    D / ▶ — Right<br>
    <br>
    <b>FLYING STONE</b>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from "three";

// =========================
// SCENE
// =========================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 150);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// =========================
// LIGHTING
// =========================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x526b38,
        2
    )
);

const sunlight = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sunlight.position.set(25, 40, 20);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(2048, 2048);

sunlight.shadow.camera.left = -45;
sunlight.shadow.camera.right = 45;
sunlight.shadow.camera.top = 45;
sunlight.shadow.camera.bottom = -45;

scene.add(sunlight);

// =========================
// GRASS TEXTURE
// =========================

const textureCanvas = document.createElement("canvas");

textureCanvas.width = 256;
textureCanvas.height = 256;

const ctx = textureCanvas.getContext("2d");

ctx.fillStyle = "#4caa43";
ctx.fillRect(0, 0, 256, 256);

for (let i = 0; i < 3500; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;

    const colors = [
        "#58b84b",
        "#439b38",
        "#64bd52",
        "#3d9135",
        "#76c85c"
    ];

    ctx.fillStyle = colors[
        Math.floor(Math.random() * colors.length)
    ];

    ctx.fillRect(x, y, 2, 3);
}

const grassTexture = new THREE.CanvasTexture(textureCanvas);

grassTexture.wrapS = THREE.RepeatWrapping;
grassTexture.wrapT = THREE.RepeatWrapping;
grassTexture.repeat.set(24, 16);
grassTexture.colorSpace = THREE.SRGBColorSpace;

// =========================
// LARGE RECTANGULAR GRASS WORLD
// =========================

const groundGeometry = new THREE.BoxGeometry(
    160,
    1,
    100
);

const groundMaterial = new THREE.MeshStandardMaterial({
    map: grassTexture,
    roughness: 1
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.position.y = -0.5;
ground.receiveShadow = true;

scene.add(ground);

// Ground top is at y = 0.

// =========================
// FLYING STONE CHARACTER
// =========================

const player = new THREE.Group();

const stoneGeometry = new THREE.BoxGeometry(
    1.8,
    1.8,
    1.8
);

const stoneMaterial = new THREE.MeshStandardMaterial({
    color: 0x888b91,
    roughness: 1,
    flatShading: true
});

const stone = new THREE.Mesh(
    stoneGeometry,
    stoneMaterial
);

stone.castShadow = true;
stone.receiveShadow = true;

player.add(stone);

// Stone details

const detailMaterial = new THREE.MeshStandardMaterial({
    color: 0x686c72,
    roughness: 1
});

const detailPositions = [
    [-0.35, 0.28, 0.91],
    [0.38, -0.3, 0.91],
    [0.12, 0.43, 0.91],
    [-0.45, -0.38, 0.91]
];

for (const [x, y, z] of detailPositions) {
    const detail = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.15, 0.035),
        detailMaterial
    );

    detail.position.set(x, y, z);
    stone.add(detail);
}

// The character always floats above the ground.

player.position.set(0, 3.2, 0);

scene.add(player);

// =========================
// MOVEMENT: WASD + ARROWS
// =========================

const keys = {};

window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();

    if (["w", "a", "s", "d", "arrowup",
         "arrowdown", "arrowleft", "arrowright",
         " "].includes(key)) {
        event.preventDefault();
    }

    keys[key] = true;
});

window.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
    for (const key in keys) {
        keys[key] = false;
    }
});

// Mobile directional buttons

const buttonKeys = {
    "up-btn": "w",
    "left-btn": "a",
    "down-btn": "s",
    "right-btn": "d"
};

for (const [id, key] of Object.entries(buttonKeys)) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys[key] = true;
        button.setPointerCapture(event.pointerId);
    });

    function releaseKey(event) {
        event.preventDefault();
        keys[key] = false;
    }

    button.addEventListener("pointerup", releaseKey);
    button.addEventListener("pointercancel", releaseKey);

    button.addEventListener("lostpointercapture", () => {
        keys[key] = false;
    });

    button.addEventListener("contextmenu", (event) => {
        event.preventDefault();
    });
}

// =========================
// CAMERA
// =========================

camera.position.set(0, 8, 12);
camera.lookAt(player.position);

// =========================
// GAME LOOP
// =========================

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const speed = 10 * delta;

    // Keyboard movement

    if (keys["w"] || keys["arrowup"]) {
        player.position.z -= speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        player.position.z += speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
        player.position.x -= speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.position.x += speed;
    }

    // Keep the character inside the world.

    player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -78,
        78
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z,
        -48,
        48
    );

    // Constant floating height.

    player.position.y = 3.2;

    // Slowly rotate the stone.

    stone.rotation.y += delta * 0.35;

    // Follow the character with the camera.

    const targetCameraPosition = new THREE.Vector3(
        player.position.x,
        player.position.y + 5,
        player.position.z + 11
    );

    camera.position.lerp(
        targetCameraPosition,
        5 * delta
    );

    camera.lookAt(
        player.position.x,
        player.position.y,
        player.position.z
    );

    renderer.render(scene, camera);
}

animate();

// =========================
// RESIZE
// =========================

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
