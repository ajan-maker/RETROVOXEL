<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETROVOXEL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.logo {
    position: absolute;
    top: 20px;
    left: 22px;
    font-size: 25px;
    font-weight: bold;
    color: black;
    letter-spacing: 1px;
}

.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.retro-button {
    background: #27ae60;
    color: white;
    border: none;
    padding: 18px 36px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.2s, transform 0.2s;
}

.retro-button:hover {
    background: #219150;
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="logo">RETROVOXEL</div>

<div class="center">
    <button class="retro-button"
    onclick="window.location.href='retroegg.html'">
        RETROegg
    </button>
</div>

</body>
</html>
