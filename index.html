<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETROVOXEL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.logo {
    position: absolute;
    top: 20px;
    left: 22px;
    font-size: 25px;
    font-weight: bold;
    color: black;
    letter-spacing: 1px;
}

/* TOP GEMS */

.gems-container {
    position: absolute;
    top: 18px;
    right: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.gems-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #111;
    padding: 7px 12px;
    border-radius: 6px;
    min-height: 40px;
}

.gem-icon {
    width: 25px;
    height: 31px;
    background: linear-gradient(
        135deg,
        #a5ff9c 0%,
        #35e75b 35%,
        #16b83d 65%,
        #087d29 100%
    );
    clip-path: polygon(
        25% 0%, 75% 0%, 100% 35%,
        50% 100%, 0% 35%
    );
    filter: drop-shadow(0 0 4px #27ae60);
    position: relative;
}

.gem-icon::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 6px;
    width: 7px;
    height: 15px;
    background: rgba(255,255,255,0.55);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
}

.gem-count {
    color: white;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
}

.gem-plus {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 6px;
    background: #27ae60;
    color: white;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
}

.gem-plus:hover {
    background: #219150;
    transform: scale(1.08);
}

/* CENTER GAME BUTTON */

.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.retro-button {
    background: #27ae60;
    color: white;
    border: none;
    padding: 18px 36px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.2s, transform 0.2s;
}

.retro-button:hover {
    background: #219150;
    transform: scale(1.05);
}

/* GEMS SHOP OVERLAY */

.shop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.shop-window {
    position: relative;
    width: 520px;
    max-width: 100%;
    background: #080808;
    color: white;
    padding: 28px;
    border: 2px solid #222;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    animation: shopAppear 0.18s ease-out;
}

@keyframes shopAppear {
    from {
        opacity: 0;
        transform: scale(0.92);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.shop-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 7px;
    background: #f3212b;
    color: white;
    font-size: 23px;
    cursor: pointer;
}

.shop-close:hover {
    background: #c91420;
}

.shop-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    padding-right: 38px;
}

.shop-gem {
    width: 30px;
    height: 38px;
    flex-shrink: 0;
}

.shop-count {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 2px;
}

.shop-buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.shop-option {
    min-height: 90px;
    background: #151515;
    border: 2px solid #2c2c2c;
    border-radius: 9px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
}

.shop-option:hover {
    background: #202020;
    border-color: #27ae60;
    transform: translateY(-2px);
}

.option-gem {
    display: block;
    color: #35e75b;
    font-size: 25px;
    margin-bottom: 8px;
}

/* MOBILE */

@media (max-width: 500px) {
    .logo {
        left: 12px;
        top: 18px;
        font-size: 20px;
    }

    .gems-container {
        top: 15px;
        right: 12px;
        gap: 7px;
    }

    .gems-box {
        gap: 8px;
        padding: 5px 8px;
        min-height: 34px;
    }

    .gem-icon {
        width: 20px;
        height: 26px;
    }

    .gem-count {
        font-size: 17px;
    }

    .gem-plus {
        width: 34px;
        height: 34px;
        font-size: 22px;
    }

    .shop-window {
        padding: 22px 16px;
    }

    .shop-header {
        margin-bottom: 22px;
    }

    .shop-option {
        min-height: 80px;
        font-size: 15px;
    }

    .shop-buttons {
        gap: 10px;
    }
}
</style>
</head>

<body>

<div class="logo">RETROVOXEL</div>

<div class="gems-container">
    <div class="gems-box">
        <div class="gem-icon"></div>
        <div class="gem-count">0000</div>
    </div>

    <button class="gem-plus" type="button" onclick="openShop()">+</button>
</div>

<div class="center">
    <button class="retro-button"
        onclick="window.location.href='retroegg.html'">
        RETROegg
    </button>
</div>

<!-- GEMS WINDOW -->

<div class="shop-overlay" id="shopOverlay" onclick="outsideClose(event)">
    <div class="shop-window">
        <button class="shop-close" onclick="closeShop()">×</button>

        <div class="shop-header">
            <div class="gem-icon shop-gem"></div>
            <div class="shop-count">0000</div>
        </div>

        <div class="shop-buttons">
            <button class="shop-option" type="button">
                <span class="option-gem">◆</span>
                GEMS
            </button>

            <button class="shop-option" type="button">
                <span class="option-gem">✦</span>
                BOOSTS
            </button>

            <button class="shop-option" type="button">
                <span class="option-gem">⬡</span>
                EXTRAS
            </button>

            <button class="shop-option" type="button">
                <span class="option-gem">✧</span>
                MORE
            </button>
        </div>
    </div>
</div>

<script>
function openShop() {
    document.getElementById("shopOverlay").style.display = "flex";
}

function closeShop() {
    document.getElementById("shopOverlay").style.display = "none";
}

function outsideClose(event) {
    if (event.target.id === "shopOverlay") {
        closeShop();
    }
}
</script>

</body>
</html>
